name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 2026-07-26 : 보안 - 의존성감사 - 게이트 (Phase 39)
      # 2026-07-26에 Next.js 고위험 9건을 고쳤는데, 그 9건은 하루 전 세션이 이미 세어 놓고
      # 결정 없이 남겨 둔 것이었다 — 문제는 발견이 아니라 아무 장치도 다시 들어 올리지
      # 않았다는 것이다. `pnpm audit`은 아무도 부르지 않으면 아무 말도 하지 않는다.
      #
      #  --prod                    런타임(dependencies + optionalDependencies)만. devDependencies
      #                            (eslint·tailwind 계열)까지 막으면 사람이 검사를 끈다.
      #  --audit-level high        high·critical만 게이트. moderate까지 막으면 배포가 상시로 선다.
      #  --ignore-registry-errors  남의 장애로 우리 배포가 서지 않게. 한계: 그때는 감사가 통과로
      #                            나오고 로그에만 사유가 남는다.
      # 면제 목록과 그 사유는 pnpm-workspace.yaml의 auditConfig.ignoreGhsas에 있고,
      # 사유 누락·근거 만료는 dependencyAuditIgnores.test.ts가 잡는다.
      - run: pnpm audit --prod --audit-level high --ignore-registry-errors

      - run: pnpm build
      - run: pnpm lint
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium

      # 2026-07-26 : e2e - 인증세션 - 시크릿수신 (Phase 40 T1)
      # e2e 62건 중 44건이 로그인 세션이 없어 죽어 있다. README가 "시크릿으로 등록하면 된다"고
      # 적어 뒀지만 **CI에 받는 단계가 없어** 등록해도 아무 일도 일어나지 않았다 — 등록할 이유가
      # 없는 상태였다. 순서를 뒤집어 받을 준비를 먼저 만든다(Phase 35 계정 삭제와 같은 방식).
      #
      # **미설정이 안전한 기본값이다**: 시크릿이 없으면 파일을 만들지 않고 지금과 똑같이
      # 44건이 스킵된다(실패 아님). 켜는 것은 사용자 결정이다 — 켜면 매 푸시마다 실제 Supabase에
      # 데이터를 만들고 지우므로 전용 테스트 계정을 쓰라고 PENDING 2번에 적었다.
      #
      # 세션 토큰이므로 **로그에 내용을 남기지 않는다**: base64를 stdout으로 흘리지 않고 파일로
      # 바로 쓰고, 만들었는지 여부만 알린다. 값이 비었을 때 빈 파일을 만들지 않도록 먼저 검사한다.
      - name: 인증 세션 파일 준비 (시크릿이 있을 때만)
        env:
          E2E_AUTH_STATE_B64: ${{ secrets.E2E_AUTH_STATE_B64 }}
        run: |
          if [ -z "$E2E_AUTH_STATE_B64" ]; then
            echo "E2E_AUTH_STATE_B64 미설정 — 인증 필요 스펙은 지금처럼 스킵됩니다."
            exit 0
          fi
          mkdir -p apps/web/e2e/.auth
          printf '%s' "$E2E_AUTH_STATE_B64" | base64 -d > apps/web/e2e/.auth/user.json
          if [ ! -s apps/web/e2e/.auth/user.json ]; then
            echo "::error::세션 파일이 비어 있습니다 — 시크릿이 올바른 base64인지 확인하세요."
            rm -f apps/web/e2e/.auth/user.json
            exit 1
          fi
          echo "인증 세션 파일을 만들었습니다 (내용은 로그에 남기지 않습니다)."

      - run: pnpm --filter web e2e
        env:
          # 저장소 변수 미설정 시 폴백: 공개 프로젝트 URL(config.toml에 이미 공개) + 더미 anon 키.
          # 비인증 스펙만 CI에서 도므로 실제 인증이 불필요하고, 더미 키라 세션이 없어
          # "미인증 → /login 리다이렉트"가 오히려 보장된다. 실제 값을 쓰려면 저장소 변수를 설정.
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://iupprzfmlyfrdcctdupn.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'ci-e2e-noauth-placeholder' }}
        # 로그인 세션 파일(e2e/.auth/user.json)이 CI에는 없어 인증 필요 스펙은 전부 자동 스킵된다
        # (실패 아님, 의도된 동작). auth-redirect.spec.ts 등 비인증 스펙만 실제로 실행된다.
        # 인증 필요 스펙까지 CI에서 돌리려면 apps/web/e2e/README.md "CI에서 실행" 절 참고.
