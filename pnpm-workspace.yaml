packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  sharp: true
  unrs-resolver: true
# 2026-07-26 : 보안 - 의존성감사 - 허용목록 (Phase 39)
# CI가 `pnpm audit --prod --audit-level high`로 게이트를 잡는다. 여기 등재된 것만 통과한다.
#
# 규칙: 무시는 판단이므로 **각 줄 위에 왜 지금 노출이 아닌지**를 적는다.
# 그 규칙은 `apps/web/src/lib/__tests__/dependencyAuditIgnores.test.ts`가 강제한다 —
# 사유 없이 한 줄 늘리면 테스트가 실패한다. 고칠 수 있으면 무시하지 말고 버전을 올린다.
auditConfig:
  ignoreGhsas:
    # sharp(high) — next의 optionalDependency. **남이 만든 이미지가 최적화 경로에 닿지 않는다**:
    # next.config.ts에 remotePatterns가 없어 Next가 원격 호스트를 전부 거부하고, next/image에
    # 넘기는 값은 우리 /duck-logo.png뿐이며 유일한 변수 src(PageEditor 표지)는 unoptimized다.
    # 이 근거는 remotePatterns가 생기는 순간 거짓이 된다 → 위 테스트가 그 조합을 실패로 만든다.
    - GHSA-f88m-g3jw-g9cj
    # postcss(high) — next가 8.4.31을 **정확히 고정**해 우리가 올릴 수 없다(16.2.11도 동일).
    # 빌드 시점에만 돌고, 공격 경로는 악의적 CSS를 빌드 입력에 넣는 것이다. 빌드는 우리
    # 저장소로만 돈다. **기계로 확인할 수 있는 전제조건이 없어** 주석 사유로만 남긴다.
    - GHSA-6g55-p6wh-862q
    # postcss(high) — 위와 같은 패키지·같은 근거(sourceMappingURL 경로 순회).
    - GHSA-r28c-9q8g-f849
